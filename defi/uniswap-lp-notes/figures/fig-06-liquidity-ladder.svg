t="normal">600</text><text x="882.0" y="444.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13" fill="#334155" text-anchor="end" font-weight="600">价格 P →</text><text x="30.0" y="98.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13" fill="#334155" text-anchor="start" font-weight="600">深度 L ↑</text><text x="248.0" y="129.3" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">厚墙</text><text x="248.0" y="158.3" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="normal">价格黏住</text><text x="311.2" y="327.5" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#b91c1c" text-anchor="middle" font-weight="700">薄</text><text x="311.2" y="355.5" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal">价格跳</text><text x="500.8" y="148.7" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">厚墙</text><text x="595.6" y="342.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#b91c1c" text-anchor="middle" font-weight="700">薄</text><rect x="90.0" y="428.0" width="850.0" height="77.0" fill="#fef2f2" stroke="#fecaca" stroke-width="1" rx="8"/><rect x="90.0" y="428.0" width="4.0" height="77.0" fill="#b91c1c" stroke="none" stroke-width="1" rx="2"/><text x="104.0" y="450.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="normal">价格冲击公式：ΔP / P = 2·Δy / (L·√P)        —— 冲击与 L 成反比</text><text x="104.0" y="469.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="normal">同样买 10 ETH：L = 1,000,000 处冲击 0.002%；L = 10,000 处冲击 0.2% —— 相差 100 倍。</text><text x="104.0" y="488.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="normal">DEX 图表上的「断崖式拉升」，原因不是买盘巨大，而是那里没人做市。</text><rect x="90.0" y="508.0" width="850.0" height="39.0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/><rect x="90.0" y="508.0" width="4.0" height="39.0" fill="#64748b" stroke="none" stroke-width="1" rx="2"/><text x="104.0" y="530.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">自我强化：价格涨进薄区 → 同样买单推动更大 → 加速 → 更多 LP 的区间被甩在身后 → 该价格上的 L 更小 → 回到第一步。</text></svg>