<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540"><defs><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/></marker><marker id="ar-v2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/></marker><marker id="ar-v3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/></marker><marker id="ar-ray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b6c2d1"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/></marker><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/></marker></defs><rect width="940" height="540" fill="#ffffff"/><text x="34" y="40" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0f172a">价格空间：钱铺在哪里</text><text x="34" y="64" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13.5" fill="#64748b">横轴 = 价格 P，纵轴 = 该价格上的流动性 L</text><rect x="80.0" y="96.0" width="830.0" height="180.0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/><text x="94.0" y="120.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="700">V2：每个价格都铺满，高度一样（L = √K 是常数）</text><rect x="110.0" y="158.0" width="760.0" height="74.0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" rx="4"/><text x="490.0" y="202.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">L 处处相同</text><line x1="110.0" y1="236.0" x2="875.0" y2="236.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ar-axis)" stroke-linecap="round"/><text x="872.0" y="256.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13" fill="#334155" text-anchor="end" font-weight="700">P</text><text x="108.0" y="256.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="normal">0</text><text x="875.0" y="256.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">∞</text><rect x="482.4" y="150.0" width="15.2" height="90.0" fill="none" stroke="#dc2626" stroke-width="2.5" rx="2"/><line x1="490.0" y1="300.0" x2="490.0" y2="250.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/><text x="490.0" y="318.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">稳定币实际只在 0.99–1.01 交易</text><text x="490.0" y="336.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal">→ 其余 99.5% 的资金全部闲置</text><rect x="80.0" y="366.0" width="830.0" height="130.0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="10"/><text x="94.0" y="390.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="700">V3：只在 [p_a, p_b] 里有深度，区间外 L = 0</text><rect x="368.4" y="418.0" width="212.8" height="58.0" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" rx="4"/><text x="474.8" y="452.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700">L &gt; 0</text><text x="474.8" y="471.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="normal">有人做市</text><text x="352.4" y="452.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">L = 0</text><text x="597.2" y="452.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">L = 0</text><line x1="110.0" y1="476.0" x2="875.0" y2="476.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ar-axis)" stroke-linecap="round"/><text x="872.0" y="496.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13" fill="#334155" text-anchor="end" font-weight="700">P</text><line x1="368.4" y1="476.0" x2="368.4" y2="482.0" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/><text x="368.4" y="498.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">p_a</text><line x1="581.2" y1="476.0" x2="581.2" y2="482.0" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/><text x="581.2" y="498.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">p_b</text><text x="490.0" y="356.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="normal">同样的钱：从「平摊到所有价格」变成「堆在一小段上」→ 深度暴涨</text><line x1="490.0" y1="344.0" x2="490.0" y2="366.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar-mute)" stroke-linecap="round"/></svg>