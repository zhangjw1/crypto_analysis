8.3 290.0 L790.9 290.8 L793.5 291.6 L796.1 292.4 L798.7 293.2 L801.3 293.9 L803.9 294.7 L806.5 295.5 L809.1 296.2 L811.8 297.0 L814.4 297.7 L817.0 298.4 L819.6 299.2 L822.2 299.9 L824.8 300.6 L827.4 301.3 L830.0 302.0" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="746.6" y="250.6" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="16" fill="#2563eb" text-anchor="start" font-weight="700">xy = K</text><text x="746.6" y="275.5" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="normal">（恒定乘积曲线）</text><line x1="100.0" y1="500.0" x2="621.4" y2="222.9" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#ar-acc)" stroke-linecap="round"/><circle cx="621.4" cy="222.9" r="7.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/><text x="636.4" y="216.9" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13" fill="#b45309" text-anchor="start" font-weight="700">池子状态 (100 A, 10 ETH)</text><text x="636.4" y="236.9" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="normal">斜率 = 10/100 = 0.1 = 价格</text><rect x="40.0" y="520.0" width="860.0" height="77.0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/><rect x="40.0" y="520.0" width="4.0" height="77.0" fill="#64748b" stroke="none" stroke-width="1" rx="2"/><text x="54.0" y="542.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">读图方法：任意一条从原点出发的直线 = 一个固定价格。线上离原点越远的点，币的数量越多，但价格相同。</text><text x="54.0" y="561.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">状态点只能沿着双曲线滑动（swap），不能离开曲线；沿射线方向移动才是「按比例加/撤流动性」。</text><text x="54.0" y="580.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">价格不是一个被存起来的变量 —— 它只是「储备比 y/x」的另一个说法。所以没有预言机、没有 keeper，池子自己不会动。</text></svg>