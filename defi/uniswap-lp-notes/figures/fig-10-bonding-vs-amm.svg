3" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="777.6" y1="138.7" x2="736.8" y2="240.2" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ar-good)" stroke-linecap="round"/><line x1="628.0" y1="292.4" x2="682.4" y2="263.4" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ar-good)" stroke-linecap="round"/><text x="784.4" y="132.9" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="600">LP 存入 A</text><text x="570.2" y="298.2" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="600">LP 存入 ETH</text><text x="730.0" y="393.9" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">对手方 = 真人 LP</text><text x="730.0" y="406.9" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="normal">最波动的阶段 LP 承担全部风险</text><rect x="62.0" y="468.0" width="870.0" height="58.0" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="8"/><rect x="62.0" y="468.0" width="4.0" height="58.0" fill="#15803d" stroke="none" stroke-width="1" rx="2"/><text x="76.0" y="490.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#15803d" text-anchor="start" font-weight="normal">Solana 的 MEME 栈（联合曲线 → 毕业后注入全区间 AMM）全程不使用集中流动性。它用的是「V2 模式」，而全区间恰恰是对波动资产更友好的模式。</text><text x="76.0" y="509.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#15803d" text-anchor="start" font-weight="normal">更关键的是：联合曲线在最疯狂的阶段根本不需要 LP —— 价格是公式算出来的，储备金是买家自己放进去的。以太坊的模型则依赖「有人愿意当 LP」。</text></svg>