<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540"><defs><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/></marker><marker id="ar-v2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/></marker><marker id="ar-v3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/></marker><marker id="ar-ray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b6c2d1"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/></marker><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/></marker></defs><rect width="940" height="540" fill="#ffffff"/><text x="34" y="40" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0f172a">区间越窄，同样资金堆出的深度越大</text><text x="34" y="64" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13.5" fill="#64748b">固定 1.852 ETH 资金，价格 P = 0.1 时能提供的流动性 L</text><text x="250.0" y="120.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="normal">对数刻度 →</text><line x1="250.0" y1="132.0" x2="250.0" y2="400.0" stroke="#e8edf3" stroke-width="1.2" stroke-linecap="round"/><text x="250.0" y="418.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="normal">1</text><line x1="453.9" y1="132.0" x2="453.9" y2="400.0" stroke="#e8edf3" stroke-width="1.2" stroke-linecap="round"/><text x="453.9" y="418.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="normal">10</text><line x1="657.7" y1="132.0" x2="657.7" y2="400.0" stroke="#e8edf3" stroke-width="1.2" stroke-linecap="round"/><text x="657.7" y="418.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="normal">100</text><line x1="250.0" y1="400.0" x2="870.0" y2="400.0" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/><text x="870.0" y="420.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13" fill="#334155" text-anchor="end" font-weight="700">L</text><text x="230.0" y="165.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#334155" text-anchor="end" font-weight="600">[0.050, 0.200]</text><text x="230.0" y="182.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">×2 / ÷2</text><rect x="250.0" y="146.0" width="203.9" height="30.0" fill="#93c5fd" stroke="none" stroke-width="1" rx="5" opacity="0.9"/><text x="465.9" y="166.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="700">L = 10</text><text x="465.9" y="184.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="normal">3.4× 于 V2</text><text x="230.0" y="229.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#334155" text-anchor="end" font-weight="600">[0.080, 0.125]</text><text x="230.0" y="246.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">±22%</text><rect x="250.0" y="210.0" width="294.1" height="30.0" fill="#60a5fa" stroke="none" stroke-width="1" rx="5" opacity="0.9"/><text x="556.1" y="230.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="700">L = 27.7</text><text x="556.1" y="248.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="normal">9.5× 于 V2</text><text x="230.0" y="293.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#334155" text-anchor="end" font-weight="600">[0.090, 0.110]</text><text x="230.0" y="310.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">±10%</text><rect x="250.0" y="274.0" width="362.3" height="30.0" fill="#3b82f6" stroke="none" stroke-width="1" rx="5" opacity="0.9"/><text x="624.3" y="294.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="700">L = 59.9</text><text x="624.3" y="312.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="normal">20.4× 于 V2</text><text x="230.0" y="357.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#334155" text-anchor="end" font-weight="600">[0.099, 0.101]</text><text x="230.0" y="374.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">±1%</text><rect x="250.0" y="338.0" width="564.4" height="30.0" fill="#dc2626" stroke="none" stroke-width="1" rx="5" opacity="0.9"/><text x="826.4" y="358.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#7f1d1d" text-anchor="start" font-weight="700">L = 587.1</text><text x="826.4" y="376.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start" font-weight="normal">200.5× 于 V2</text><rect x="60.0" y="452.0" width="820.0" height="77.0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" rx="8"/><rect x="60.0" y="452.0" width="4.0" height="77.0" fill="#1d4ed8" stroke="none" stroke-width="1" rx="2"/><text x="74.0" y="474.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="normal">公式：E = 1 / (1 − √(p_a / P))        —— 相对 V2 的深度倍数</text><text x="74.0" y="493.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="normal">同样的钱，区间从「×2/÷2」收窄到「±1%」，深度提升 58 倍（3.4× → 199.5×）。</text><text x="74.0" y="512.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="normal">代价：区间越窄，价格越容易走出去。深度和「出界风险」是同一枚硬币的两面。</text></svg>