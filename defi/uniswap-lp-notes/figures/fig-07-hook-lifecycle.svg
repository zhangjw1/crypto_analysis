<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660"><defs><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/></marker><marker id="ar-v2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/></marker><marker id="ar-v3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/></marker><marker id="ar-ray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b6c2d1"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/></marker><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/></marker></defs><rect width="980" height="660" fill="#ffffff"/><text x="34" y="40" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0f172a">一次 swap 的完整 Hook 调用链</text><text x="34" y="64" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13.5" fill="#64748b">Hook 的两次回调夹着真正的 swap 数学，并且都能影响结果</text><rect x="360.0" y="92.0" width="240.0" height="58.0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8" rx="9"/><text x="480.0" y="116.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="700">用户 / 路由</text><text x="480.0" y="137.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="normal">调用 PoolManager.swap()</text><line x1="480.0" y1="150.0" x2="480.0" y2="176.0" stroke="#334155" stroke-width="1.8" marker-end="url(#ar-axis)" stroke-linecap="round"/><rect x="290.0" y="176.0" width="380.0" height="100.0" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.8" rx="9"/><text x="480.0" y="200.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13.5" fill="#92400e" text-anchor="middle" font-weight="700">① Hooks.beforeSwap()</text><text x="480.0" y="221.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="normal">检查 bit7 → 决定是否回调</text><text x="480.0" y="238.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="normal">回调 hook.beforeSwap(...)</text><text x="480.0" y="255.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="normal">校验 返回 96 字节 + selector 一致</text><line x1="480.0" y1="276.0" x2="480.0" y2="316.0" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#ar-acc)" stroke-linecap="round"/><text x="504.0" y="292.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="normal">可改 swap 数量</text><text x="504.0" y="308.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="normal">可覆盖费率 · 可返回 delta</text><rect x="290.0" y="320.0" width="380.0" height="60.0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.8" rx="9"/><text x="480.0" y="344.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">② 真正的 swap 数学</text><text x="480.0" y="365.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="normal">用可能已被修改的 amount 和 fee 执行</text><line x1="480.0" y1="380.0" x2="480.0" y2="406.0" stroke="#334155" stroke-width="1.8" marker-end="url(#ar-axis)" stroke-linecap="round"/><rect x="290.0" y="406.0" width="380.0" height="100.0" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.8" rx="9"/><text x="480.0" y="430.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13.5" fill="#b91c1c" text-anchor="middle" font-weight="700">③ Hooks.afterSwap()</text><text x="480.0" y="451.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal">检查 bit6 → 决定是否回调</text><text x="480.0" y="468.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal">回调 hook.afterSwap(...)</text><text x="480.0" y="485.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal">校验 返回 64 字节 + selector 一致</text><line x1="480.0" y1="506.0" x2="480.0" y2="532.0" stroke="#334155" stroke-width="1.8" marker-end="url(#ar-axis)" stroke-linecap="round"/><rect x="290.0" y="532.0" width="380.0" height="58.0" fill="#dcfce7" stroke="#86efac" stroke-width="1.8" rx="9"/><text x="480.0" y="556.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="13.5" fill="#15803d" text-anchor="middle" font-weight="700">④ 结算</text><text x="480.0" y="577.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="normal">swapDelta = swapDelta − hookDelta</text><rect x="40.0" y="176.0" width="226.0" height="115.0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/><rect x="40.0" y="176.0" width="4.0" height="115.0" fill="#334155" stroke="none" stroke-width="1" rx="2"/><text x="54.0" y="198.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal">Hook delta 的正负约定</text><text x="54.0" y="217.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal">（源码注释原文）</text><text x="54.0" y="236.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal"></text><text x="54.0" y="255.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal">Positive：hook 应收 / 已收</text><text x="54.0" y="274.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal">Negative：hook 应付 / 已付</text><rect x="702.0" y="176.0" width="238.0" height="134.0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" rx="8"/><rect x="702.0" y="176.0" width="4.0" height="134.0" fill="#1d4ed8" stroke="none" stroke-width="1" rx="2"/><text x="716.0" y="198.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="normal">四道内置护栏</text><text x="716.0" y="217.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="normal"></text><text x="716.0" y="236.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="normal">① selector 必须原样回传</text><text x="716.0" y="255.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="normal">② 返回长度必须精确</text><text x="716.0" y="274.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="normal">③ noSelfCall 防递归</text><text x="716.0" y="293.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="start" font-weight="normal">④ 权限与地址必须一致</text><rect x="702.0" y="406.0" width="238.0" height="115.0" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" rx="8"/><rect x="702.0" y="406.0" width="4.0" height="115.0" fill="#92400e" stroke="none" stroke-width="1" rx="2"/><text x="716.0" y="428.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#92400e" text-anchor="start" font-weight="normal">第 ④ 步的含义</text><text x="716.0" y="447.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#92400e" text-anchor="start" font-weight="normal"></text><text x="716.0" y="466.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#92400e" text-anchor="start" font-weight="normal">用户承担 hook 的收支</text><text x="716.0" y="485.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#92400e" text-anchor="start" font-weight="normal">→ 这就是「hook 手续费」</text><text x="716.0" y="504.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Segoe UI, sans-serif" font-size="12.5" fill="#92400e" text-anchor="start" font-weight="normal">  的实现方式</text></svg>